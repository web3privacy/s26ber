      /* Scoped styling for the self-rendered agenda (room-column timeline) */
      #agenda-root .agenda-day-title { font-size: 1.5rem; font-weight: 700; margin: 2.5rem 0 1.25rem; text-align: center; }

      #agenda-root .agenda-col-head { height: 2.5rem; display: flex; align-items: center; justify-content: center; font-weight: 700; position: sticky; top: 0; }
      #agenda-root .agenda-track { position: relative; border-left: 1px solid rgba(255,255,255,0.10); }
      #agenda-root .agenda-gutter .agenda-track { border-left: none; }
      #agenda-root .agenda-hour { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,0.08); }
      #agenda-root .agenda-hour-label { position: absolute; right: 0.4rem; transform: translateY(-0.6rem); font-size: 0.78rem; opacity: 0.55; font-variant-numeric: tabular-nums; }

      #agenda-root a.agenda-block:hover { background: rgba(124, 95, 196, 0.35); border-color: rgba(255,255,255,0.45); z-index: 5; }
      #agenda-root .agenda-block .b-title { font-size: 0.9rem; font-weight: 600; line-height: 1.2; margin: 0 0 0.12rem; }
      #agenda-root .agenda-block .b-time { display: block; font-size: 0.72rem; opacity: 0.65; font-variant-numeric: tabular-nums; }

      @media (max-width: 640px) {

        #agenda-root .agenda-room-col:not(.active) { display: none; }
        #agenda-root .agenda-room-col .agenda-col-head { display: none; }
      }

  <script>
    // Render the agenda from the pretalx schedule feed.
    (function () {
      var root = document.getElementById('agenda-root');
      var status = document.getElementById('agenda-status');
      var base = root.getAttribute('data-event-base');
      var feed = base + '/schedule/widgets/schedule.json';

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function localize(name) {
        if (name == null) return '';
        if (typeof name === 'string') return name;
        return name.en || name[Object.keys(name)[0]] || '';
      }

      function fmtTime(iso, tz) {
        try {
          return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: tz });
        } catch (e) {
          return iso.slice(11, 16);
        }
      }

      function dayKey(iso, tz) {
        try {
          return new Date(iso).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: tz });
        } catch (e) {
          return iso.slice(0, 10);
        }
      }

      var PX_PER_MIN = 3.6; // vertical scale of the timeline (keeps short sessions readable)

      fetch(feed, { mode: 'cors' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (data) {
          var talks = (data.talks || []).slice().filter(function (t) { return t.start && t.end; });
          if (!talks.length) {
            status.textContent = 'The agenda has not been published yet. Please check back soon.';
            return;
          }
          var tz = data.timezone || 'Europe/Berlin';

          var roomName = {};
          (data.rooms || []).forEach(function (rm) { roomName[rm.id] = localize(rm.name); });
          var speakers = {};
          (data.speakers || []).forEach(function (sp) { speakers[sp.code] = sp.name; });

          // Preserve declared room order, but only keep rooms that have sessions.
          var roomOrder = (data.rooms || []).map(function (rm) { return rm.id; })
            .filter(function (id) { return talks.some(function (t) { return t.room === id; }); });
          if (!roomOrder.length) roomOrder = [null];

          // Group talks by day.
          var days = {}, dayOrder = [];
          talks.forEach(function (t) {
            var k = dayKey(t.start, tz);
            if (!days[k]) { days[k] = []; dayOrder.push(k); }
            days[k].push(t);
          });

          var html = '';
          dayOrder.forEach(function (k) {
            var dayTalks = days[k];
            var startMs = Math.min.apply(null, dayTalks.map(function (t) { return +new Date(t.start); }));
            var endMs = Math.max.apply(null, dayTalks.map(function (t) { return +new Date(t.end); }));
            var dayStart = new Date(Math.floor(startMs / 3600000) * 3600000); // floor to the hour
            var totalMin = Math.ceil((endMs - +dayStart) / 60000);
            var gridH = totalMin * PX_PER_MIN;

            function topOf(iso) { return ((+new Date(iso)) - (+dayStart)) / 60000 * PX_PER_MIN; }

            // Hour gridlines + gutter labels.
            var lines = '', labels = '';
            for (var m = 0; m <= totalMin; m += 60) {
              var y = m * PX_PER_MIN;
              lines += '<div class="agenda-hour" style="top:' + y + 'px"></div>';
              var hr = new Date(+dayStart + m * 60000);
              labels += '<div class="agenda-hour-label" style="top:' + y + 'px">' + esc(fmtTime(hr.toISOString(), tz)) + '</div>';
            }

            // Within a room, split overlapping sessions into side-by-side sub-columns.
            function layout(items) {
              items.sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
              var cluster = [], clusterEnd = -1;
              function place(cl) {
                var colEnds = [];
                cl.forEach(function (it) {
                  var s = +new Date(it.start), e = +new Date(it.end), ci = -1;
                  for (var i = 0; i < colEnds.length; i++) { if (s >= colEnds[i]) { ci = i; break; } }
                  if (ci < 0) ci = colEnds.length;
                  colEnds[ci] = e; it._col = ci;
                });
                cl.forEach(function (it) { it._cols = colEnds.length; });
              }
              items.forEach(function (it) {
                var s = +new Date(it.start);
                if (cluster.length && s >= clusterEnd) { place(cluster); cluster = []; clusterEnd = -1; }
                cluster.push(it);
                clusterEnd = Math.max(clusterEnd, +new Date(it.end));
              });
              if (cluster.length) place(cluster);
              return items;
            }

            // Room columns.
            var cols = '', tabs = '';
            roomOrder.forEach(function (rid, ri) {
              tabs += '<button type="button" class="agenda-room-tab' + (ri === 0 ? ' active' : '') + '" data-idx="' + ri + '">' +
                esc(rid == null ? 'Room' : (roomName[rid] || 'Room')) + '</button>';
              var blocks = '';
              layout(dayTalks.filter(function (t) { return t.room === rid; })).forEach(function (t) {
                var top = topOf(t.start);
                var h = Math.max(((+new Date(t.end)) - (+new Date(t.start))) / 60000 * PX_PER_MIN - 3, 18);
                var w = 100 / (t._cols || 1);
                var leftCss = 'calc(' + (t._col || 0) * w + '% + 4px)';
                var widthCss = 'calc(' + w + '% - 8px)';
                var names = (t.speakers || []).map(function (c) { return speakers[c] || c; }).filter(Boolean).join(', ');
                var href = base + '/talk/' + encodeURIComponent(t.code) + '/';
                blocks += '<a class="agenda-block" style="top:' + top + 'px;height:' + h + 'px;left:' + leftCss + ';width:' + widthCss + '" ' +
                  'href="' + esc(href) + '" target="_blank" rel="noopener" title="' + esc(t.title) + '">' +
                  '<p class="b-title">' + esc(t.title) + '</p>' +
                  '<span class="b-time">' + esc(fmtTime(t.start, tz)) + '–' + esc(fmtTime(t.end, tz)) + '</span>' +
                  (names ? '<span class="b-spk">' + esc(names) + '</span>' : '') +
                  '</a>';
              });
              cols += '<div class="agenda-col agenda-room-col' + (ri === 0 ? ' active' : '') + '" data-idx="' + ri + '">' +
                '<div class="agenda-col-head">' + esc(rid == null ? '' : (roomName[rid] || '')) + '</div>' +
                '<div class="agenda-track" style="height:' + gridH + 'px">' + lines + blocks + '</div>' +
              '</div>';
            });

            html += '<div class="agenda-day">' +
              '<h2 class="agenda-day-title">' + esc(k) + '</h2>' +
              '<div class="agenda-room-toggle">' + tabs + '</div>' +
              '<div class="agenda-scroll"><div class="agenda-grid">' +
                '<div class="agenda-col agenda-gutter">' +
                  '<div class="agenda-col-head"></div>' +
                  '<div class="agenda-track" style="height:' + gridH + 'px">' + labels + '</div>' +
                '</div>' + cols +
              '</div></div>' +
            '</div>';
          });
          root.innerHTML = html;

          // Mobile room toggle: switch which room column is visible (per day).
          root.querySelectorAll('.agenda-day').forEach(function (day) {
            var tabEls = day.querySelectorAll('.agenda-room-tab');
            var colEls = day.querySelectorAll('.agenda-room-col');
            tabEls.forEach(function (tab) {
              tab.addEventListener('click', function () {
                var idx = tab.getAttribute('data-idx');
                tabEls.forEach(function (t) { t.classList.toggle('active', t === tab); });
                colEls.forEach(function (c) { c.classList.toggle('active', c.getAttribute('data-idx') === idx); });
              });
            });
          });
        })
        .catch(function (err) {
          status.innerHTML = 'Could not load the agenda. ' +
            '<a href="' + esc(base) + '/schedule/" target="_blank" rel="noopener">View it on pretalx &rarr;</a>';
          if (window.console) console.error('Agenda load failed:', err);
        });
    })();

    // Close mobile menu when a nav link is clicked
    document.querySelectorAll('.mobile-menu-panel a').forEach(function(link) {
      link.addEventListener('click', function(e) {
        var href = this.getAttribute('href');
        if (href && href.startsWith('#')) {
          e.preventDefault();
          var target = document.querySelector(href);
          if (target) target.scrollIntoView();
        }
        setTimeout(function() {
          document.getElementById('mobile-menu-toggle').checked = false;
        }, 50);
      });
    });
  </script>
